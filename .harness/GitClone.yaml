pipeline:
  name: Git-Clone
  identifier: GitClone
  projectIdentifier: CI
  orgIdentifier: default
  tags:
    kartikeya: ""
  stages:
    - stage:
        name: Git-Clone
        identifier: GitClone
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          execution:
            steps:
              - step:
                  type: Run
                  name: RunName
                  identifier: Run_1
                  spec:
                    connectorRef: account.harnessImage
                    image: nginx
                    shell: Bash
                    command: |-
                      echo "Installing Harness CLI v3.3.0..."
                      export HARNESS_CLI_VERSION="3.3.0"

                      # Set API URL globally to ensure all CLI commands use app3
                      export HARNESS_API_URL="https://app.harness.io"

                      # Download and install Harness CLI with specific version
                      curl -fsSL https://raw.githubusercontent.com/harness/harness-unified-cli/main/install.sh | VERSION=$HARNESS_CLI_VERSION sh
                      export PATH="/root/.local/bin:$PATH"

                      echo "Checking CLI version..."
                      harness version

                      echo "=== Authenticating with Harness CLI ==="
                      harness auth login \
                        --api-token "$HARNESS_API_KEY" \
                        --api-url "$HARNESS_API_URL" \
                        --account "$HARNESS_ACCOUNT_ID" \
                        --org "$HARNESS_ORG" \
                        --project "$HARNESS_PROJECT"

                      echo ""
                      echo "Verifying authentication..."
                      harness auth status --profile ci

                      echo ""
                      echo "=== Exporting Harness_CLI Pipeline ==="
                      harness get pipeline "$PIPELINE_TO_EXPORT" \
                        --profile ci \
                        --org "$HARNESS_ORG" \
                        --project "$HARNESS_PROJECT" \
                        --format yaml > git.yaml

                      echo ""
                      echo "=== Pipeline Export Successful ==="
                      echo "Pipeline saved to: git.yaml"
                    envVariables:
                      HARNESS_API_KEY: <+secrets.getValue("account.CLI_SAT_token")>
                      HARNESS_ACCOUNT_ID: OXdjLZ7ETs6AUZ1tUzVH3A
                      HARNESS_ORG: default
                      HARNESS_PROJECT: CI
                      PIPELINE_TO_EXPORT: GitClone
                  timeout: 1d 1h
          caching:
            enabled: false
            paths: []
          buildIntelligence:
            enabled: false
          sharedPaths:
            - /tmp/shared
            - /var/run
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
        variables:
          - name: VERSION
            type: String
            description: ""
            required: false
            value: <+"0.0.1-"+<+pipeline.sequenceId>>
    - stage:
        name: Status-repro
        identifier: Statusrepro
        description: ""
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: ShellScript_1
                  identifier: ShellScript_1
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: echo hi
                    environmentVariables: []
                    outputVariables: []
                  timeout: 10m
        tags: {}
        sendGitStatus:
          enabled: true
          name: Status-test
  variables:
    - name: test1
      type: String
      description: ""
      required: false
      value: test2
  allowStageExecutions: true
  properties:
    ci:
      codebase:
        connectorRef: account.GitHub
        repoName: CI-Usecases
        build: <+input>
        sparseCheckout: []
